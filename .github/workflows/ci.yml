# Confere o projeto a cada push e pull request.
# - app: sintaxe e testes do IdleHub (Node 22 e 24; o Electron já traz o Node dele).
# - idlelive: sintaxe e testes do Painel (pasta idlelive/), nas mesmas versões do IdleLive avulso:
#   Node 20 (mínimo dele), 22 (primeiro com WebSocket, usado pelo farm da Kick e pelo PubSub da Twitch) e 24 (LTS atual).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      # Os testes não abrem o Electron: não precisa baixar o binário.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Dependências
        run: npm ci
      - name: Sintaxe
        run: npm run check
      - name: Testes
        run: npm test

  idlelive:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: idlelive
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # O IdleLive não tem dependências: não precisa de npm ci.
      - name: Sintaxe
        run: node scripts/check.js
      - name: Testes
        run: node --test
